<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" role="img" aria-label="Four-legged heraldic dragon silhouette">
  <defs>
    <linearGradient id="hide" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#dc9b90"/>
      <stop offset="1" stop-color="#ac6065"/>
    </linearGradient>
  </defs>
  <g stroke="#351a20" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
    <!-- Curled tail behind the legs and body. -->
    <path d="M112 151 C84 143 53 151 37 174 C21 197 32 223 56 221 C38 216 37 201 51 189 C65 178 81 193 100 182 L132 168 Z" fill="#9c5b62"/>
