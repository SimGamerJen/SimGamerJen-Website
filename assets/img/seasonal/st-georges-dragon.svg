    <!-- Near foreleg: foot 4, reaching forward with spread claws. -->
    <path id="near-foreleg" d="M206 143 C216 150 222 163 224 174 L238 187 L255 193 L272 189 L287 195 L273 199 L287 204 L272 205 L278 213 L261 207 L248 208 L225 194 L209 179 L196 158 Z" fill="#c88179"/>
    <!-- Horned head, narrow snout and open jaw. -->
    <path d="M214 107 L229 89 L234 64 L246 83 L259 77 L273 88 L290 93 L305 96 L295 103 L314 112 L288 116 L269 110 L253 121 L236 116 Z" fill="#bf7973"/>
    <path d="M246 87 L256 61 L264 81 L273 70 L275 93 Z" fill="#a46564"/>
    <path d="M272 111 L303 121 L274 119 L253 116 Z" fill="#87474e"/>
    <circle cx="283" cy="99" r="3.3" fill="#26191d" stroke="none"/>
    <path d="M113 145 L105 128 L124 137 L127 124 L142 135 L148 123 L156 135" fill="#a26464"/>
  </g>
</svg>