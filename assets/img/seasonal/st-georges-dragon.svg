    <!-- Far foreleg: foot 3, dropped straight below the shoulder. -->
    <path id="far-foreleg" d="M185 147 C184 161 191 173 193 184 L190 206 L181 215 L176 226 L187 222 L194 229 L200 219 L208 226 L210 211 L214 182 L207 156 Z" fill="#96565e"/>
    <!-- Folded wing and separate finger bones above all four legs. -->
    <path d="M120 140 Q83 117 51 43 L111 78 L134 17 L163 89 L205 43 Q206 101 185 141 Z" fill="#91565c"/>
    <path d="M120 136 Q115 101 110 76 L134 27 L157 93 M144 128 Q171 104 195 56" stroke="#d6a39a" stroke-width="4" opacity=".58" fill="none"/>
    <!-- Solid torso and curved neck; limb roots tuck behind the belly. -->
    <path d="M101 147 C117 129 144 122 163 134 C181 144 193 130 199 112 C205 97 214 88 227 100 C242 113 239 137 223 151 C203 166 178 179 147 180 C122 180 106 167 101 147 Z" fill="url(#hide)"/>
    <!-- Near hind leg: foot 2, distinct thigh and clawed paw. -->
